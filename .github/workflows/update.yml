# Collects the news and publishes the website to GitHub Pages.
#
# Runs:  every 30 minutes, when you press "Run workflow" on the Actions tab,
#        and whenever you push (commit) a change to the main branch.
#
# If the collector fails, nothing is published and the site keeps showing the
# last good version. The run shows a red cross so you can see what went wrong.

name: Update Broadsheet

on:
  schedule:
    # At 7 and 37 minutes past every hour (UTC). Not on the hour exactly,
    # because GitHub is busiest then and runs get delayed more.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two runs publish at the same time. A run that starts while another
# is going waits for it instead of cancelling it.
concurrency:
  group: broadsheet-pages
  cancel-in-progress: false

jobs:
  build:
    name: Collect news and build the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the project files
        uses: actions/checkout@v6

      - name: Read the GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install the collector's libraries
        run: python -m pip install -r collector/requirements.txt

      - name: Download the previous news data from the live site
        run: python collector/fetch_previous.py --base-url "${{ steps.pages.outputs.base_url }}" --out previous

      - name: Collect the news
        run: python collector/collect.py --feeds feeds.yaml --previous previous --out build-data

      - name: Put the website and fresh data together
        run: |
          rm -rf _site
          cp -r site _site
          rm -rf _site/data
          mkdir -p _site/data
          cp build-data/*.json _site/data/
          # Give the offline cache a new version whenever the code changes.
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::12}/" _site/sw.js
          echo "Site contents:" && find _site -type f | sort

      - name: Upload the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
