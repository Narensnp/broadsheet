# =============================================================================
#  Broadsheet news sources
# =============================================================================
#
#  This is the ONLY file you need to edit to add or remove news sources.
#  After you save (commit) a change on GitHub, the site rebuilds automatically.
#
#  Each source is one block that starts with "- name:". The fields are:
#
#    name      The outlet's name as shown on the site. Several feeds can share
#              one name (e.g. "BBC News" for world, business and tech feeds);
#              they then count as ONE source when counting coverage, and you
#              can hide them all at once in the site's source settings.
#    url       The RSS or Atom feed address the outlet publishes.
#    homepage  The outlet's normal website (used for the source link).
#    category  Which section the feed belongs to. Must be one of:
#                world       -> World & Politics
#                business    -> Business & Finance
#                technology  -> Technology
#                science     -> Innovation & Science
#                asia        -> Singapore & Asia
#    region    Broad part of the world: Europe, Americas, Asia,
#              Middle East, Africa or Oceania. Used to colour the coverage bar.
#    country   Country the outlet is based in.
#
#  Rules of thumb
#    - Indentation matters in YAML: keep two spaces before each field,
#      exactly like the entries below.
#    - To switch a feed off without deleting it, put "# " in front of every
#      line of its block (that turns it into a comment).
#    - Only add feeds that the publisher offers publicly. Broadsheet never
#      scrapes article pages.
#
#  About Reuters, AP and Nikkei Asia
#    Reuters and the Associated Press stopped publishing public RSS feeds,
#    and Nikkei Asia does not offer one. They are therefore not included.
#    Their reporting still shows up indirectly, because many outlets below
#    carry their wire stories.
# =============================================================================

